<div class="row">
  <div class="col-12 text-end mb-3">
    <button class="btn btn-info" (click)="addTrip()" *ngIf="isLoggedIn()">Add Trip</button>
  </div>
</div>

<div class="row">
  <div *ngFor="let trip of trips" class="col-md-4">
    <app-trip-card [trip]="trip" class="card-deck mt-2"></app-trip-card>
  </div>
</div>
